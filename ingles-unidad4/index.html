<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Review · Unit 4 · Life on Earth</title>
<style>
:root{
  --bg:#f4f7f6; --card:#fff; --ink:#1d2b33; --muted:#5b6b74; --line:#dfe6e9;
  --pri:#154a94; --pri-soft:#e7eefa; --ok:#1f9d55; --ok-soft:#e3f6ea; --bad:#d64545; --bad-soft:#fde8e8;
  --c:#ffd166; --s:#8ecae6;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--pri);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:1.35rem}
.brand{background:#fff;border-radius:14px;padding:6px;margin:0 auto 12px;max-width:420px;text-align:center}
.brand img{width:100%;height:auto;display:block}
header{text-align:center}
header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:6px 8px}
nav button{flex:0 0 auto;border:0;background:transparent;padding:10px 14px;border-radius:999px;font-size:.95rem;color:var(--muted);cursor:pointer;font-weight:600}
nav button.on{background:var(--pri);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px 12px 60px}
section.tab{display:none}
section.tab.on{display:block}
.intro{background:var(--pri-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.intro h2{margin:0 0 4px;font-size:1.2rem}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.act h3{margin:0;font-size:1.05rem}
.act h3 .num{display:inline-block;background:var(--pri);color:#fff;border-radius:8px;padding:1px 8px;margin-right:6px;font-size:.9rem}
.hint{color:var(--muted);font-size:.9rem;margin:4px 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:.92rem}
.btn.check{background:var(--pri);color:#fff}
.btn.sec{background:#eef2f3;color:var(--ink)}
.score{font-weight:700;margin-left:auto}
.score.good{color:var(--ok)} .score.mid{color:#b7791f} .score.low{color:var(--bad)}
/* chips & drops */
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:#fafcfc;margin-bottom:12px}
.chip{display:inline-block;padding:7px 12px;border-radius:999px;background:#fff;border:2px solid var(--pri);color:var(--pri);font-weight:600;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-size:.95rem}
.chip.sel{background:var(--pri);color:#fff}
.chip.dragging{opacity:.3}
.chip.ghost{position:fixed;z-index:1000;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2);background:#fff}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:110px;min-height:40px;border:2px dashed #b8c6cb;border-radius:999px;padding:2px;vertical-align:middle;background:#fff}
.slot.over,.bin.over,.bank.over{border-color:var(--pri);background:var(--pri-soft)}
.slot.ok{border:2px solid var(--ok);background:var(--ok-soft)}
.slot.bad{border:2px solid var(--bad);background:var(--bad-soft)}
.slot .chip{border-style:solid}
.slot.ok .chip{border-color:var(--ok);color:var(--ok)}
.slot.bad .chip{border-color:var(--bad);color:var(--bad)}
.grid-pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pic{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:#fff}
.pic svg{width:100%;height:auto;border-radius:8px;display:block;margin-bottom:8px}
.rows .row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rows .row:last-child{border-bottom:0}
.rows .row .txt{flex:1 1 240px}
.sent{padding:9px 0;border-bottom:1px solid var(--line)}
.sent:last-child{border-bottom:0}
.lead{font-weight:700;color:var(--pri);margin-right:4px}
/* bins */
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.bin{border:2px dashed #b8c6cb;border-radius:12px;padding:8px;min-height:110px;background:#fff}
.bin h4{margin:0 0 2px;font-size:.95rem}
.bin .rule{font-size:.82rem;color:var(--muted);margin-bottom:6px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
/* mc */
.mcq{padding:10px 0;border-bottom:1px solid var(--line)}
.mcq:last-child{border-bottom:0}
.mcq .q{font-weight:600;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.95rem;text-align:left}
.opt:hover{border-color:var(--pri)}
.opt.picked{border-color:var(--pri);background:var(--pri-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:.88rem;color:var(--muted);margin-top:6px;display:none}
.why.show{display:block}
/* type */
.tq{padding:9px 0;border-bottom:1px solid var(--line)}
.tq:last-child{border-bottom:0}
input.ti{border:2px solid #b8c6cb;border-radius:8px;padding:6px 8px;font-size:.95rem;min-width:120px;max-width:100%}
input.ti.wide{width:100%;margin-top:6px}
input.ti.ok{border-color:var(--ok);background:var(--ok-soft)}
input.ti.bad{border-color:var(--bad);background:var(--bad-soft)}
.sol{color:var(--ok);font-size:.88rem;font-weight:600;margin-left:6px}
table.forms{border-collapse:collapse;width:100%}
table.forms th,table.forms td{border:1px solid var(--line);padding:6px;text-align:left}
table.forms th{background:#f0f5f5}
table.forms input.ti{width:100%;min-width:0}
/* order */
.oq{padding:10px 0;border-bottom:1px solid var(--line)}
.oq:last-child{border-bottom:0}
.built{min-height:44px;border:2px dashed #b8c6cb;border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;margin-bottom:6px}
.built.ok{border:2px solid var(--ok);background:var(--ok-soft)}
.built.bad{border:2px solid var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:2px solid #9fb3ba;background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.95rem}
.built .tile{border-color:var(--pri);color:var(--pri);font-weight:600}
/* highlight */
.mode{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.mode button{border:2px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:#fff;font-weight:600}
.mode button.on{border-color:var(--ink)}
.mode .mc{background:var(--c)} .mode .ms{background:var(--s)} .mode .mx{background:#fff}
.tok{cursor:pointer;border-radius:5px;padding:1px 2px}
.tok.c{background:var(--c)} .tok.s{background:var(--s)}
.tok.okm{outline:2px solid var(--ok)} .tok.badm{outline:2px solid var(--bad)}
.legend{font-size:.85rem;color:var(--muted)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:10px;padding:10px 12px;font-size:.95rem}
.card h4{margin:0 0 6px}
.card ul{margin:0;padding-left:18px}
.report{margin-top:12px;border-radius:12px;padding:12px;background:#fff8e6;border:1px solid #f3d28a;display:none}
.report.show{display:block}
.report h4{margin:0 0 6px}
.missed{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.missed div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:.9rem}
.missed svg{width:100%;height:auto;border-radius:6px}
.paintings{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.paintings figure{margin:0;text-align:center;font-size:.85rem}
.big-score{font-size:2rem;font-weight:800;color:var(--pri)}
.tag{display:inline-block;font-size:.75rem;background:#eef2f3;border-radius:6px;padding:1px 6px;margin-left:6px;color:var(--muted);font-weight:600}
@media (max-width:560px){.slot{min-width:90px}.chip{font-size:.9rem;padding:6px 10px}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[¿?¡!.,;:]/g,'').replace(/\s+/g,' ').trim();

const R={}; // results
function setScore(act,c,t){const s=$('.score',act);const p=t?c/t:0;s.textContent=c+' / '+t;s.className='score '+(p>=.8?'good':p>=.5?'mid':'low');}

/* ---------- drag & tap ---------- */
let selected=null, drag=null;
function chip(text,extra={}){const c=document.createElement('span');c.className='chip';c.textContent=text;c.dataset.v=text;Object.assign(c.dataset,extra);c.addEventListener('pointerdown',onDown);return c;}
function clearFb(act){$$('.ok,.bad',act).forEach(x=>{if(!x.classList.contains('opt'))x.classList.remove('ok','bad')});const s=$('.score',act);if(s){s.textContent='';}}
function onDown(e){if(e.button>0)return;const c=e.currentTarget;drag={chip:c,x:e.clientX,y:e.clientY,moved:false};c.setPointerCapture(e.pointerId);c.addEventListener('pointermove',onMove);c.addEventListener('pointerup',onUp);c.addEventListener('pointercancel',onCancel);}
function target(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;const t=el.closest('.drop');if(!t||t.closest('.act')!==drag.chip.closest('.act'))return null;return t;}
function onMove(e){if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  if(!drag.moved){drag.moved=true;const r=drag.chip.getBoundingClientRect();const g=drag.chip.cloneNode(true);g.classList.add('ghost');g.classList.remove('sel','ok','bad');document.body.appendChild(g);drag.g=g;drag.ox=drag.x-r.left;drag.oy=drag.y-r.top;drag.chip.classList.add('dragging');if(selected){selected.classList.remove('sel');selected=null;}}
  drag.g.style.left=(e.clientX-drag.ox)+'px';drag.g.style.top=(e.clientY-drag.oy)+'px';
  $$('.over').forEach(x=>x.classList.remove('over'));const t=target(e.clientX,e.clientY);if(t)t.classList.add('over');

/* ---------- vocab report ---------- */
function vocabReport(d,r){const rp=$('.report',d);const miss=new Set(r.miss);const parts=[];
  ['v1','v2','v3'].forEach(id=>{if(R[id])R[id].miss.forEach(m=>miss.add(m));});
  const names={v1:'Pictures',v2:'Definitions',v3:'Match the columns',v4:'Integrated'};
  const done=Object.keys(names).filter(id=>R[id]).map(id=>`${names[id]}: <b>${R[id].c}/${R[id].t}</b>`).join(' · ');
  const notDone=['v1','v2','v3'].filter(id=>!R[id]).length;
  let h=`<h4>Your report / Tu informe</h4><div>${done}</div>`;
  if(notDone)h+=`<div class="hint">Tip: do (and check) activities 1, 2 and 3 too for a full report.</div>`;
  const list=V.filter(v=>miss.has(v.w));
  if(!list.length)h+='<p><b>Excellent!</b> You know all the words. 🎉</p>';
  else h+=`<p>Review these words (${list.length}) / Repasá estas palabras:</p><div class="missed">${list.map(v=>`<div>${pic(v.w)}<b>${v.w}</b><br>${v.es}</div>`).join('')}</div>`;
  rp.innerHTML=h;rp.classList.add('show');}

const INFO=`<div class="info"><div class="card"><h4>Iberian lynxes</h4><ul><li>They are wild cats.</li><li>They eat meat.</li><li>They live in Spain.</li><li>They can live for 13 years.</li><li>In danger: they can't find enough food; people kill them.</li></ul></div><div class="card"><h4>Loggerhead turtles</h4><ul><li>They live in warm oceans and seas.</li><li>They eat jellyfish, crabs and shellfish.</li><li>They can live for more than 50 years.</li><li>In danger: plastic in the sea and fishing nets.</li></ul></div></div>`;
TABS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.name;b.dataset.t=t.id;b.onclick=()=>show(t.id);nav.appendChild(b);

function show(id){$$('section.tab').forEach(s=>s.classList.toggle('on',s.id==='tab-'+id));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));history.replaceState(null,'','#'+id);window.scrollTo({top:0});}
show((location.hash||'#vocab').slice(1)&&TABS.some(t=>'#'+t.id===location.hash)?location.hash.slice(1):'vocab');

function buildTest(s){const d=document.createElement('div');d.className='act';d.innerHTML='<div class="body"></div><div class="bar"><button class="btn check">Correct my test ✓</button><button class="btn sec again">Start again ↺</button></div><div class="report"></div>';s.appendChild(d);
  const body=$('.body',d);const picks={};
  EVAL.forEach((it,i)=>{const q=document.createElement('div');q.className='mcq';q.innerHTML=`<div class="q">${i+1}. ${it.q} <span class="tag">1 point</span></div><div class="opts"></div><div class="why"></div>`;
    it.o.forEach((o,k)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=String.fromCharCode(97+k)+') '+o;b.onclick=()=>{if(d.dataset.done)return;picks[i]=k;$$('.opt',q).forEach(x=>x.classList.remove('picked'));b.classList.add('picked');};$('.opts',q).appendChild(b);});
    body.appendChild(q);});
  $('.check',d).onclick=()=>{const missing=EVAL.map((_,i)=>i).filter(i=>!(i in picks));if(missing.length&&!d.dataset.warned){d.dataset.warned=1;alertBox(d,`You didn't answer question(s): ${missing.map(i=>i+1).join(', ')}. Press again to correct anyway.`);return;}
    d.dataset.done=1;let c=0;const weak={};
    $$('.mcq',d).forEach((q,i)=>{const it=EVAL[i];const ops=$$('.opt',q);ops[it.a].classList.add('ok');if(picks[i]===it.a)c++;else{if(i in picks)ops[picks[i]].classList.add('bad');weak[it.topic]=(weak[it.topic]||0)+1;}
      const w=$('.why',q);w.textContent=picks[i]===it.a?'✓ 1 point':'✗ 0 points';w.classList.add('show');});
    const rp=$('.report',d);const msg=c>=9?'Excellent! You are ready.':c>=7?'Very good! Review the topics below.':c>=5?'Good. Practise the topics below again.':'Go back to the tabs and practise again.';
    rp.innerHTML=`<div class="big-score">${c} / 10</div><p><b>${msg}</b></p>`+(Object.keys(weak).length?`<p>To review / Para reforzar: ${Object.entries(weak).map(([k,v])=>`<b>${k}</b> (${v})`).join(' · ')}</p>`:'');rp.classList.add('show');rp.scrollIntoView({behavior:'smooth',block:'center'});};
  $('.again',d).onclick=()=>{d.remove();buildTest(s);};}
